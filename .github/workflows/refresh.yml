name: Auto Refresh Dashboard

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'          # 每 10 分钟：行情 + 快讯 + 日历 + 复盘(盘后自动)
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

# 同一时间只跑一个实例，避免并发写 data.json 冲突
concurrency:
  group: dashboard-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate snapshots (行情 / 快讯 / 日历 / 复盘)
        run: |
          node _gen.js        || echo "[warn] _gen.js 部分标失败（可接受）"
          node _gen_news.js   || echo "[warn] _gen_news.js 抓取失败"
          node _gen_calendar.js || echo "[warn] _gen_calendar.js 失败"
          node _gen_review.js || echo "[warn] _gen_review.js 失败（将沿用已有复盘）"

      # 闸门：校验不过就不部署（此前是 `node _validate.js || echo`，失败照常上线，护栏形同虚设）
      - name: Build & validate
        run: |
          node _build.js
          node _validate.js

      # 旧链接代理走 jsDelivr CDN 取仓库文件，需把最新构建提交回仓库并刷新 CDN 缓存。
      # 注意：此前只 add index.html/data.json，漏了 news.json/calendar.json，
      # 导致 jsDelivr 上这两个快照长期陈旧（9/1 vs data.json 9/11）；
      # 且前端"签名不同即整体替换"会把陈旧的日历覆盖回页面，必须一并提交。
      - name: Commit data back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock-dashboard/index.html stock-dashboard/*.json
          git diff --cached --quiet || (git commit -m "auto: data refresh [skip ci]" && git push)

      - name: Purge jsDelivr CDN cache
        run: |
          for f in index.html data.json news.json calendar.json; do
            curl -sf "https://purge.jsdelivr.net/gh/Peiqiyin1310/stock-dashboard@main/stock-dashboard/$f" || echo "[warn] purge $f 失败"
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 只发布运行产物：剔除模板/校验脚本/代理源码（此前 /_template.html、/_check.js 均可被公开下载）
      - name: Clean non-artifact sources
        run: rm -f stock-dashboard/_template.html stock-dashboard/_check.js stock-dashboard/server.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: stock-dashboard

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
